[tox]
envlist = py,docs,ruff,ruff-format

[testenv]
deps =
    pytest
    pytest-cov
    responses
commands =
    py.test --basetemp={envtmpdir} --cov=mopidy_podcast_itunes --cov-report term-missing {posargs}

[testenv:docs]
deps =
     sphinx
commands =
     sphinx-build -W -b html -d {envtmpdir}/doctrees docs {envtmpdir}/html

[testenv:ruff]
deps =
    ruff
commands =
    ruff check {posargs}
skip_install = true

[testenv:ruff-format]
deps =
    ruff
commands =
    ruff format --diff -q {posargs}
skip_install = true

[testenv:pyright]
deps =
    pyright
    pytest
commands =
    pyright {posargs}
